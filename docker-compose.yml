version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: graphone
      POSTGRES_PASSWORD: graphone
      POSTGRES_DB: graphone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphone"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
